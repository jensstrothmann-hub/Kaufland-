<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaufland-Prospekt & Einkaufsliste</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, Arial, sans-serif; color:#222; background:#f4f4f4; }
  header { padding:10px 14px; background:#c8102e; color:white; font-weight:700; }
  main { display:grid; grid-template-columns: 1fr 1fr; gap:10px; padding:10px; height:calc(100dvh - 48px); }
  section { background:white; border:1px solid #ddd; border-radius:8px; overflow:hidden; display:flex; flex-direction:column; min-height:0; }
  h2 { font-size:16px; margin:0; padding:10px 12px; border-bottom:1px solid #ddd; }
  iframe { border:0; width:100%; height:100%; flex:1; min-height:0; }
  .notes { padding:10px; display:flex; flex-direction:column; flex:1; min-height:0; gap:8px; }
  textarea { width:100%; flex:1; min-height:180px; resize:none; border:1px solid #ccc; border-radius:6px; padding:12px; font:16px/1.5 system-ui, Arial, sans-serif; }
  .hint { color:#666; font-size:12px; }
  button { background:#c8102e; color:white; border:0; border-radius:6px; padding:9px 12px; font-size:14px; }
  .actions { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  @media (max-width:700px) {
    main { grid-template-columns:1fr; grid-template-rows:minmax(45vh, 1fr) minmax(35vh, .8fr); height:auto; min-height:calc(100dvh - 48px); }
    section { min-height:35vh; }
    iframe { min-height:42vh; }
    .notes { min-height:30vh; }
  }
</style>
</head>
<body>
<header>Kaufland-Prospekt & Einkaufsliste</header>
<main>
  <section>
    <h2>📖 Prospekt – blättern und zoomen</h2>
    <iframe id="prospekt" src="" title="Kaufland-Prospekt"></iframe>
  </section>
  <section>
    <h2>🛒 Meine Einkaufsliste / Notizen</h2>
    <div class="notes">
      <div class="hint">PDF-Link einmal unten im Code eintragen. Artikel, Mengen und Notizen einfach zeilenweise aufschreiben.</div>
      <textarea id="notes" placeholder="Zum Beispiel:
Bananen – 2 kg – 1,76 €
Butter – 2 Packungen
Milch – 3 Stück

Weitere Notizen …"></textarea>
      <div class="actions">
        <button id="download">Liste als TXT speichern</button>
        <button id="clear" type="button">Liste leeren</button>
        <span class="hint" id="status">Wird auf diesem Gerät automatisch gespeichert.</span>
      </div>
    </div>
  </section>
</main>
<script>
https://drive.google.com/uc?export=download&id=1eN9A_fNbBvCDO21zekGlc1dFDyn2oYck
document.getElementById('prospekt').src =
  (PDF_URL.startsWith('https://') ? PDF_URL : 'kaufland-prospekt.pdf') + '#toolbar=1&navpanes=0';
const notes = document.getElementById('notes');
const status = document.getElementById('status');
try { notes.value = localStorage.getItem('kaufland-einkaufsliste-notizen') || ''; } catch(e) {}
notes.addEventListener('input', () => {
  try { localStorage.setItem('kaufland-einkaufsliste-notizen', notes.value); status.textContent = 'Gespeichert auf diesem Gerät.'; }
  catch(e) { status.textContent = 'Bitte Liste als TXT speichern.'; }
});
document.getElementById('download').addEventListener('click', () => {
  const blob = new Blob([notes.value], {type:'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'einkaufsliste.txt'; a.click();
  URL.revokeObjectURL(url);
});
document.getElementById('clear').addEventListener('click', () => {
  if (confirm('Möchtest du die Einkaufsliste wirklich leeren?')) {
    notes.value = '';
    try { localStorage.removeItem('kaufland-einkaufsliste-notizen'); } catch(e) {}
    status.textContent = 'Liste geleert.';
  }
});
</script>
</body>
</html>
